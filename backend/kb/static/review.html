<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · 复核</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<style>
  :root { --line:#e5e7eb; --muted:#6b7280; --bg:#f9fafb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         color:#111827; background:var(--bg); }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line);
           padding:12px 20px; display:flex; gap:20px; align-items:center; z-index:10; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:none; background:none; padding:6px 12px; border-radius:6px;
                 cursor:pointer; color:var(--muted); font-size:13px; }
  .tabs button.active { background:#111827; color:#fff; }
  .tabs .n { opacity:.7; margin-left:2px; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  .meta { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .badge { background:#fef3c7; color:#92400e; border-radius:4px; padding:2px 8px; font-size:12px; }
  .badge.approved { background:#dcfce7; color:#166534; }
  .badge.rejected { background:#fee2e2; color:#991b1b; }
  .badge.pending { background:#e0e7ff; color:#3730a3; }
  .doc { color:var(--muted); font-size:13px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .cols img { width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .md { background:var(--bg); padding:12px; border-radius:6px; max-height:520px;
        overflow:auto; font-family:inherit; }
  .md p { margin:0 0 8px; }
  .md p:last-child { margin-bottom:0; }
  .md ul, .md ol { margin:0 0 8px; padding-left:22px; }
  .md .katex-display { margin:8px 0; overflow-x:auto; overflow-y:hidden; padding:4px 0; }
  .actions { margin-top:12px; display:flex; gap:8px; }
  .btn { border:none; border-radius:6px; padding:8px 18px; cursor:pointer; font-size:14px; }
  .btn.approve { background:#059669; color:#fff; }
  .btn.reject { background:#dc2626; color:#fff; }
  .btn.plain { background:#e5e7eb; color:#111827; }
  .btn:disabled { opacity:.5; cursor:default; }
  .editor { width:100%; min-height:260px; font:13px/1.6 ui-monospace,Menlo,monospace;
            padding:10px; border:1px solid var(--line); border-radius:6px;
            resize:vertical; box-sizing:border-box; }
  .hint { color:var(--muted); font-size:12px; align-self:center; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
</style>
</head>
<body>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/dompurify/purify.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/render.js"></script>
<header>
  <h1>知识库 · 复核</h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="list"><div class="empty">加载中…</div></main>
<script>
const TABS = [["pending","待复核"], ["approved","已通过"], ["rejected","已打回"]];
const LABEL = { pending:"待复核", approved:"已通过", rejected:"已打回" };
let status = "pending";

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

async function refresh() {
  const data = await (await fetch("/api/review?status=" + status)).json();
  renderTabs(data.counts);
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!data.items.length) {
    list.innerHTML = '<div class="empty">无记录</div>';
    return;
  }
  for (const it of data.items) list.appendChild(card(it));
}

function renderTabs(counts) {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const [s, label] of TABS) {
    const b = document.createElement("button");
    b.innerHTML = `${label}<span class="n">${counts[s] ?? 0}</span>`;
    if (s === status) b.classList.add("active");
    b.onclick = () => { status = s; refresh(); };
    nav.appendChild(b);
  }
}

function card(it) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `
    <div class="meta">
      <span class="badge">${esc(it.reason)}</span>
      <span class="badge ${it.status}">${LABEL[it.status]}</span>
      <span class="doc">${esc(it.doc_title)} · 第 ${it.page_no} 页</span>
    </div>
    <div class="cols">
      ${it.block_id ? `<img src="/api/blocks/${it.block_id}/crop" alt="页面裁图">` : ""}
      ${it.content_md
        ? `<div class="md">${renderContent(it.content_md)}</div>`
        : '<div class="md">（空转录）</div>'}
    </div>
    ${it.status === "pending" ? `
    <div class="actions">
      <button class="btn approve">✓ 通过</button>
      <button class="btn plain edit">✎ 编辑</button>
      <button class="btn reject">✗ 打回</button>
    </div>` : ""}`;
  const on = (sel, action) => {
    const btn = d.querySelector(sel);
    if (btn) btn.onclick = () => act(it.id, action, btn);
  };
  on(".btn.approve", "approve");
  on(".btn.reject", "reject");
  const editBtn = d.querySelector(".btn.edit");
  if (editBtn) editBtn.onclick = () => enterEdit(d, it);
  return d;
}

function enterEdit(cardEl, it) {
  const md = cardEl.querySelector(".md");
  const original = it.content_md || "";
  md.innerHTML = "";
  const ta = document.createElement("textarea");
  ta.className = "editor";
  ta.value = original;
  md.appendChild(ta);
  const bar = document.createElement("div");
  bar.className = "actions";
  bar.innerHTML = '<button class="btn approve">保存</button>' +
                  '<button class="btn plain">取消</button>' +
                  '<span class="hint"></span>';
  md.appendChild(bar);
  const [saveBtn, cancelBtn] = bar.querySelectorAll("button");
  const hint = bar.querySelector(".hint");
  cancelBtn.onclick = () => {
    md.innerHTML = original ? renderContent(original) : "（空转录）";
  };
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    const resp = await fetch(`/api/blocks/${it.block_id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content_md: ta.value }),
    });
    if (!resp.ok) {
      saveBtn.disabled = false;
      hint.textContent = "保存失败: " + resp.status;
      return;
    }
    const data = await resp.json();
    saveBtn.disabled = false;
    alert(`已保存，自动关闭 ${data.resolved_reviews} 条复核记录`);
    refresh();
  };
}

async function act(id, action, btn) {
  btn.disabled = true;
  const resp = await fetch(`/api/review/${id}/${action}`, { method: "POST" });
  if (!resp.ok) { btn.disabled = false; alert("操作失败: " + resp.status); return; }
  refresh();
}

refresh();
</script>
</body>
</html>
